name: vision-stack

services:
  mock-backend:
    build: ./mock-backend
    image: mock-backend:latest
    container_name: mock-backend
    restart: unless-stopped
    environment:
      DB_PATH: /data/backend/backend.db
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key}
      EMB_DIM: "512"
      SEED_TENANTS: ${SEED_TENANTS:-t_demo}
    volumes:
      - backend-data:/data/backend
    ports:
      - "127.0.0.1:18091:9000"   # chỉ localhost để debug; production có thể bỏ hẳn

  vision-api:
    build: ./vision-api
    image: vision-api:latest
    container_name: vision-api
    restart: unless-stopped
    depends_on:
      - mock-backend
    environment:
      INSIGHTFACE_MODEL: ${INSIGHTFACE_MODEL:-buffalo_l}
      MODEL_ROOT: /data/models/insightface
      DET_SIZE: ${DET_SIZE:-640}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.40}
      TOP_K: ${TOP_K:-5}
      VISION_BACKEND_URL: http://mock-backend:9000
      VISION_BACKEND_INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key}
      VISION_API_TOKENS: ${VISION_API_TOKENS}
      VISION_RATE_LIMIT_PER_MIN: ${VISION_RATE_LIMIT_PER_MIN:-120}
      VISION_PREFETCH_ON_START: "true"
      VISION_POST_EVENTS: "true"
    volumes:
      - models:/data/models
    ports:
      - "18090:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  backend-data:
